<div 
  class="flex justify-between items-center p-3.5 rounded-2xl border transition-all duration-300"
  [class]="borderClass()"
>
  <div class="space-y-0.5">
    <span class="text-[9px] uppercase font-w590 tracking-wider block" [class]="labelClass()">{{ title() }}</span>
    <span class="text-2xl font-w590 block tracking-tight text-snow">{{ value() }}</span>
  </div>
  
  <div class="flex items-center justify-center opacity-90 pr-1">
    @if (status() === 'total') {
      <svg class="w-6 h-6 text-slate dark:text-fog" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
      </svg>
    } @else if (status() === 'active') {
      <svg class="w-6 h-6 text-emerald" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3,3" d="M3 17c3-3 8-6 13-3l5-5"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M18 9h3v3"/>
      </svg>
    } @else if (status() === 'delayed') {
      <svg class="w-6 h-6 text-crimson" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <polyline points="12 7 12 12 15 14" />
      </svg>
    } @else if (status() === 'arrived') {
      <svg class="w-6 h-6 text-cyan" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <line x1="2" y1="20" x2="22" y2="20" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 13v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S8 2.67 8 3.5V6L2 11v2l6-1.5V16l-1.5 1v1.5l2.5-.5 2.5.5V17.5L10 16v-4.5L19 13z" transform="rotate(15 10 10)" />
      </svg>
    }
  </div>
</div>
