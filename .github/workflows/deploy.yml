name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - develop # Or change to 'main' if you want it to deploy from main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular Application
        run: npx ng build --configuration=production --base-href="https://rahul-shaw18.github.io/Flight-Tracking/"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/Flight-Tracking/browser
          branch: gh-pages